default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  username: <%= ENV.fetch("DB_USERNAME", "root") %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "social_media") %>

test:
  <<: *default
  database: <%= ENV.fetch("DB_TEST_NAME", "social_media_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "app_production") %>
  username: <%= ENV.fetch("DB_USERNAME", "app") %>
  password: <%= ENV.fetch("DB_PASSWORD") %>
